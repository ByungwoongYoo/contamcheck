[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contamcheck"
version = "0.2.0"
description = "Audit provenance shortcuts and compare random and group-held-out cross-validation on labelled tabular datasets."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Byungwoong Yoo"}]
keywords = ["machine learning", "data leakage", "cross-validation", "group k-fold",
            "batch effect", "materials informatics", "dataset audit", "provenance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
chem = ["rdkit>=2022.9"]
parquet = ["pyarrow>=8"]
test = ["pytest>=7"]

[project.scripts]
contamcheck = "contamcheck.cli:run"

[project.urls]
Homepage = "https://github.com/ByungwoongYoo/contamcheck"
Repository = "https://github.com/ByungwoongYoo/contamcheck"
Issues = "https://github.com/ByungwoongYoo/contamcheck/issues"

[tool.setuptools]
packages = ["contamcheck"]

[tool.setuptools.package-data]
contamcheck = ["web.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
